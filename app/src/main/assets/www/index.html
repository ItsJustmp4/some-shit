<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spck Website Creator + AI</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2330; --border:#2b3442;
  --fg:#e6edf3; --muted:#8b98a9; --accent:#4f8cff; --accent2:#7c5cff;
  --ok:#3fb950; --err:#f85149; --warn:#d29922;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--fg);border-radius:8px;padding:6px 12px;transition:.15s}
button:hover{border-color:var(--accent);color:#fff}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
code,kbd{font-family:Consolas,monospace}

header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;white-space:nowrap}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .chip{font-size:10px;background:var(--accent2);color:#fff;border-radius:20px;padding:2px 8px;vertical-align:2px;margin-left:6px;-webkit-text-fill-color:#fff}
header .spacer{flex:1}
.hbtn{padding:6px 10px;font-size:13px}

main{flex:1;display:grid;grid-template-columns:210px 1fr 1fr;min-height:0}

aside{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:12px}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 8px}
.file-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-family:Consolas,monospace;font-size:13px;border:1px solid transparent}
.file-item:hover{background:var(--bg3);color:var(--fg)}
.file-item.active{background:var(--bg3);border-color:var(--accent);color:var(--fg)}
.file-item .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tpl{padding:9px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--bg3)}
.tpl:hover{border-color:var(--accent)}
.tpl b{display:block;font-size:13px}
.tpl small{color:var(--muted)}

.editor-pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab{padding:9px 18px;cursor:pointer;color:var(--muted);font-family:Consolas,monospace;font-size:13px;border-right:1px solid var(--border);user-select:none}
.tab.active{color:var(--fg);background:var(--bg);box-shadow:inset 0 2px 0 var(--accent)}
#editor{flex:1;resize:none;border:none;border-radius:0;background:var(--bg);color:var(--fg);font-family:Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.6;padding:14px 16px;tab-size:2;white-space:pre;overflow:auto}
#editor:focus{border:none;box-shadow:inset 0 0 0 1px var(--accent)}
.statusbar{display:flex;gap:16px;padding:5px 14px;background:var(--bg2);border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.statusbar .ok{color:var(--ok)}

.panel{display:flex;flex-direction:column;min-width:0}
.panel-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.ptab{flex:1;text-align:center;padding:9px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;user-select:none}
.ptab.active{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.page{flex:1;display:none;min-height:0;flex-direction:column}
.page.active{display:flex}
#preview{width:100%;flex:1;border:none;background:#fff}

.ai-settings{padding:12px;border-bottom:1px solid var(--border);background:var(--bg2);max-height:46%;overflow-y:auto}
.ai-body{flex:1;display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .apply-note{color:var(--ok);font-size:12px;margin-top:6px}
.msg .err-note{color:var(--err);font-size:12px;margin-top:6px}
.prompt-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--bg2)}
#prompt{flex:1;resize:none;height:44px}
.key-row{display:flex;gap:6px}
.key-row input{flex:1}
.eye{width:42px;flex:none;padding:0}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.hint a{color:var(--accent)}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:1px}
.badge.ok{background:rgba(63,185,80,.15);color:var(--ok)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--warn)}
#tempVal{float:right;color:var(--fg)}

#consoleLog{flex:1;overflow-y:auto;padding:12px;font-family:Consolas,monospace;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.cl{padding:3px 8px;border-radius:6px;word-break:break-all}
.cl.log{background:rgba(139,152,169,.08)}
.cl.info{background:rgba(79,140,255,.1);color:#9cc0ff}
.cl.warn{background:rgba(210,153,34,.12);color:var(--warn)}
.cl.error{background:rgba(248,81,73,.12);color:var(--err)}
.console-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg2);font-size:12px;color:var(--muted)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--accent);color:var(--fg);padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:980px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr}
  aside{display:flex;gap:14px;border-right:none;border-bottom:1px solid var(--border)}
  aside section{flex:1}
  .editor-pane{border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>

<header>
  <div class="logo">Spck <span>Creator</span><span class="chip">+ AI</span></div>
  <button class="hbtn" id="btnSave" title="Ctrl+S">💾 Сохранить</button>
  <button class="hbtn" id="btnExport">⬇ Экспорт HTML</button>
  <button class="hbtn" id="btnFiles">📦 Скачать файлы</button>
  <button class="hbtn" id="btnRun">▶ Запустить</button>
  <div class="spacer"></div>
  <button class="hbtn" id="btnNew">🗑 Новый проект</button>
</header>

<main>
  <aside>
    <section>
      <h3>Файлы проекта</h3>
      <div id="fileList"></div>
    </section>
    <section style="flex:2">
      <h3>Шаблоны</h3>
      <div id="tplList"></div>
    </section>
  </aside>

  <div class="editor-pane">
    <div class="tabs" id="edTabs"></div>
    <textarea id="editor" spellcheck="false" wrap="off"></textarea>
    <div class="statusbar">
      <span id="stCursor">Стр 1, Кол 1</span>
      <span id="stLang">HTML</span>
      <span class="ok" id="stSaved"></span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-tabs">
      <div class="ptab active" data-page="previewPage">Превью</div>
      <div class="ptab" data-page="aiPage">🤖 ИИ</div>
      <div class="ptab" data-page="consolePage">Консоль</div>
    </div>

    <div class="page active" id="previewPage">
      <iframe id="preview" sandbox="allow-scripts allow-modals"></iframe>
    </div>

    <div class="page" id="aiPage">
      <div class="ai-settings">
        <label>Провайдер ИИ</label>
        <select id="aiProvider"></select>
        <label>API-ключ <a id="keyLink" href="#" target="_blank" style="float:right">где взять?</a></label>
        <div class="key-row">
          <input type="password" id="aiKey" placeholder="sk-..." autocomplete="off">
          <button class="eye" id="btnEye" title="Показать">👁</button>
        </div>
        <label>Модель</label>
        <input id="aiModel" list="modelList" placeholder="название модели">
        <datalist id="modelList"></datalist>
        <div id="customWrap" style="display:none">
          <label>Endpoint (OpenAI-совместимый)</label>
          <input id="aiEndpoint" placeholder="https://my-proxy.com/v1/chat/completions">
        </div>
        <label>Температура <span id="tempVal">0.7</span></label>
        <input type="range" id="aiTemp" min="0" max="1.5" step="0.1" value="0.7">
        <div class="hint" id="corsHint"></div>
      </div>
      <div class="ai-body">
        <div id="chat"></div>
        <div class="prompt-row">
          <textarea id="prompt" placeholder="Опиши сайт, который нужно создать... (Ctrl+Enter — отправить)"></textarea>
          <button class="primary" id="btnSend">Отправить</button>
        </div>
      </div>
    </div>

    <div class="page" id="consolePage">
      <div class="console-bar">
        <span>Консоль превью</span>
        <button class="hbtn" id="btnClearConsole">Очистить</button>
      </div>
      <div id="consoleLog"><div class="cl log">Консоль пуста — запустите превью.</div></div>
    </div>
  </div>
</main>

<div id="toast"></div>

"script.js": 'var PRODUCTS = [\n  {emoji:"🎧", name:"Наушники", desc:"Беспроводные", price:4990},\n  {emoji:"⌚", name:"Смарт-часы", desc:"С пульсометром", price:8990},\n  {emoji:"⌨️", name:"Клавиатура", desc:"Механическая", price:6490},\n  {emoji:"🖱️", name:"Мышь", desc:"Игровая", price:2990},\n  {emoji:"📱", name:"Чехол", desc:"Для телефона", price:990},\n  {emoji:"🔊", name:"Колонка", desc:"Портативная", price:3990}\n];\nvar cart = 0;\nvar grid = document.getElementById("grid");\nPRODUCTS.forEach(function(p, i){\n  var el = document.createElement("div");\n  el.className = "card";\n  el.innerHTML = \'<div class="emoji">\' + p.emoji + \'</div><h3>\' + p.name + \'</h3><small>\' + p.desc + \'</small><div class="row"><span class="price">\' + p.price.toLocaleString("ru-RU") + \' ₽</span><button data-i="\' + i + \'">В корзину</button></div>\';\n  grid.appendChild(el);\n});\ndocument.getElementById("grid").addEventListener("click", function(e){\n  var b = e.target.closest("button"); if(!b) return;\n  cart += PRODUCTS[+b.dataset.i].price;\n  document.getElementById("cartTotal").textContent = cart.toLocaleString("ru-RU") + " ₽";\n  console.log("Добавлено:", PRODUCTS[+b.dataset.i].name);\n});'

const SYSTEM_PROMPT = "Ты — ИИ-ассистент внутри веб-IDE Spck Creator. Тебе доступны три файла проекта: index.html, style.css, script.js. " +
"Текущие файлы присланы ниже. Твоя задача — вернуть ОБНОВЛЁННЫЕ полные версии всех трёх файлов, каждый в отдельном блоке кода: ```html (содержимое index.html БЕЗ тегов <style> и <script>), ```css (весь style.css), ```js (весь script.js). " +
"Пиши код полностью, без сокращений и «// остальное без изменений». Ответ на русском. После блоков кода добавь 1-2 предложения о том, что сделано. " +

/* ================= HELPERS ================= */
const $ = function(id){ return document.getElementById(id); };
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2600); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= FILES / TABS ================= */
function renderFiles(){
  $("fileList").innerHTML = Object.keys(files).map(function(f){
    var color = f.endsWith(".html") ? "#f85149" : f.endsWith(".css") ? "#4f8cff" : "#d29922";
    return '<div class="file-item' + (f === activeFile ? " active" : "") + '" data-f="' + f + '"><span class="dot" style="background:' + color + '"></span>' + f + '</div>';
  }).join("");
  $("edTabs").innerHTML = Object.keys(files).map(function(f){
    return '<div class="tab' + (f === activeFile ? " active" : "") + '" data-f="' + f + '">' + f + '</div>';
  }).join("");
  var lang = activeFile.endsWith(".html") ? "HTML" : activeFile.endsWith(".css") ? "CSS" : "JavaScript";
  $("stLang").textContent = lang;
}
$("fileList").addEventListener("click", function(e){ var it = e.target.closest(".file-item"); if(it) openFile(it.dataset.f); });
$("edTabs").addEventListener("click", function(e){ var it = e.target.closest(".tab"); if(it) openFile(it.dataset.f); });
function openFile(f){ files[activeFile] = $("editor").value; activeFile = f; $("editor").value = files[f]; renderFiles(); updateCursor(); }
$("editor").addEventListener("input", function(){ files[activeFile] = this.value; scheduleRun(); setSaved("● Не сохранено", "#d29922"); });
$("editor").addEventListener("keydown", function(e){
  if(e.key === "Tab"){ e.preventDefault(); var s = this.selectionStart, en = this.selectionEnd;
    this.value = this.value.slice(0, s) + "  " + this.value.slice(en);
    this.selectionStart = this.selectionEnd = s + 2; files[activeFile] = this.value; scheduleRun(); }
  if(e.key === "s" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveProject(); }
});
$("editor").addEventListener("click", updateCursor);
$("editor").addEventListener("keyup", updateCursor);
function updateCursor(){ var t = $("editor"), pos = t.selectionStart, before = t.value.slice(0, pos).split("\n");
  $("stCursor").textContent = "Стр " + before.length + ", Кол " + (before[before.length-1].length + 1); }

/* ================= TEMPLATES ================= */
$("tplList").innerHTML = TEMPLATES.map(function(t, i){ return '<div class="tpl" data-i="' + i + '"><b>' + t.name + '</b><small>' + t.desc + '</small></div>'; }).join("");
$("tplList").addEventListener("click", function(e){ var it = e.target.closest(".tpl"); if(!it) return;
  files = JSON.parse(JSON.stringify(TEMPLATES[+it.dataset.i].files));

/* ================= PREVIEW ================= */
let runTimer = null;
function scheduleRun(){ clearTimeout(runTimer); runTimer = setTimeout(runPreview, 1500); }
function runPreview(){
  files[activeFile] = $("editor").value;
  var html = files["index.html"] || "";
  var css = files["style.css"] || "";
  var js = files["script.js"] || "";
  var hook = "<script>['log','info','warn','error'].forEach(function(l){var o=console[l];console[l]=function(){try{var parts=[].map.call(arguments,function(a){if(a instanceof Error)return a.message;try{return typeof a==='object'?JSON.stringify(a):String(a)}catch(e){return String(a)}});parent.postMessage({spckConsole:1,level:l,text:parts.join(' ')},'*')}catch(e){}if(o)o.apply(console,arguments)}});window.onerror=function(m,s,ln){parent.postMessage({spckConsole:1,level:'error',text:m+' (строка '+ln+')'},'*')}<\/script>";
  var userJs = "<script>try{" + js.replace(/<\/script/gi, "<\\/script") + "\n}catch(e){parent.postMessage({spckConsole:1,level:'error',text:'JS: '+e.message},'*')}<\/script>";
  var doc;
  if(/<\/body>/i.test(html)) doc = html.replace(/<\/body>/i, "<style>" + css + "<\/style>" + hook + userJs + "<\/body>");
  else doc = html + "<style>" + css + "<\/style>" + hook + userJs;
  if(!/<style[\s>]/i.test(doc)) doc = doc.replace(/<\/head>/i, "<style>" + css + "<\/style><\/head>");
  $("preview").srcdoc = doc;
}
window.addEventListener("message", function(e){
  var d = e.data; if(!d || d.spckConsole !== 1) return;
  addConsole(d.level, d.text);
});
function addConsole(level, text){
  var log = $("consoleLog");
  if(log.firstChild && log.firstChild.textContent.indexOf("Консоль пуста") === 0) log.innerHTML = "";
  var div = document.createElement("div");
  div.className = "cl " + level;
  div.textContent = "[" + level + "] " + text;
  log.appendChild(div); log.scrollTop = log.scrollHeight;
}
$("btnClearConsole").addEventListener("click", function(){ $("consoleLog").innerHTML = '<div class="cl log">Консоль очищена.</div>'; });
$("btnRun").addEventListener("click", function(){ runPreview(); toast("Превью обновлено"); });

/* ================= SAVE / EXPORT ================= */
function setSaved(text, color){ var el = $("stSaved"); el.textContent = text; el.style.color = color || ""; }

function download(name, content){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], {type:"text/plain;charset=utf-8"}));
  a.download = name; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}
$("btnExport").addEventListener("click", function(){
  files[activeFile] = $("editor").value;
  var html = files["index.html"] || "";
  var css = files["style.css"] || "", js = files["script.js"] || "";
  var doc;
  if(/<\/head>/i.test(html)) doc = html.replace(/<\/head>/i, "<style>\n" + css + "\n<\/style>\n<\/head>");
  else doc = "<style>\n" + css + "\n<\/style>\n" + html;
  if(/<\/body>/i.test(doc)) doc = doc.replace(/<\/body>/i, "<script>\n" + js + "\n<\/script>\n<\/body>");
  else doc += "\n<script>\n" + js + "\n<\/script>";
  download("site.html", doc); toast("Скачан единый site.html");
});
$("btnFiles").addEventListener("click", function(){
  files[activeFile] = $("editor").value;

/* ================= AI SETTINGS ================= */
const provSel = $("aiProvider");
provSel.innerHTML = Object.keys(PROVIDERS).map(function(k){ return '<option value="' + k + '">' + PROVIDERS[k].name + "</option>"; }).join("");
function loadSettings(){
  var p = localStorage.getItem(LS.prov); if(p && PROVIDERS[p]) provSel.value = p;
  $("aiKey").value = localStorage.getItem(LS.key) || "";
  $("aiModel").value = localStorage.getItem(LS.model) || "";
  $("aiTemp").value = localStorage.getItem(LS.temp) || "0.7";

/* ================= CHAT ================= */
let chat = [];
try{ chat = JSON.parse(localStorage.getItem(LS.chat) || "[]"); }catch(e){ chat = []; }
function renderChat(){
  $("chat").innerHTML = chat.map(function(m){
    if(m.role === "user") return '<div class="msg user">' + esc(m.text) + "</div>";
    var extra = "";
    if(m.applied) extra = '<div class="apply-note">✅ Код применён в редактор</div>';
    if(m.error) extra = '<div class="err-note">⚠️ ' + esc(m.error) + "</div>";
    return '<div class="msg bot">' + esc(m.text) + extra + "</div>";
  }).join("");
  $("chat").scrollTop = $("chat").scrollHeight;
}
function pushMsg(m){ chat.push(m); if(chat.length > 60) chat = chat.slice(-60); localStorage.setItem(LS.chat, JSON.stringify(chat)); renderChat(); }

function parseBlocks(text){
  var out = {}, re = /```(html|css|js|javascript|style|script)?\s*\n?([\s\S]*?)```/gi, m;
  while((m = re.exec(text))){
    var lang = (m[1] || "").toLowerCase(), body = m[2].replace(/\n$/, "");
    if(lang === "javascript" || lang === "script") lang = "js";
    if(lang === "style") lang = "css";
    if(!lang){
      if(/^\s*</.test(body)) lang = "html";
      else if(/[{;}]/.test(body) && !/function|var |let |const /.test(body)) lang = "css";
      else lang = "js";
    }
    if(lang === "html") out["index.html"] = body;
    else if(lang === "css") out["style.css"] = body;
    else if(lang === "js") out["script.js"] = body;
  }
  return (out["index.html"] !== undefined || out["style.css"] !== undefined || out["script.js"] !== undefined) ? out : null;
}
function stripBlocks(text){ return text.replace(/```[\s\S]*?```/g, "").trim(); }

function applyBlocks(blocks){
  Object.keys(blocks).forEach(function(f){ files[f] = blocks[f]; });
  $("editor").value = files[activeFile];
  renderFiles(); runPreview();
}

/* ================= AI REQUEST ================= */
async function callAI(userText){
  var p = PROVIDERS[provSel.value];
  var key = $("aiKey").value.trim();
  var model = $("aiModel").value.trim() || p.models[0] || "";
  var temp = parseFloat($("aiTemp").value) || 0.7;
  if(!key) throw new Error("Введите API-ключ для " + p.name);
  if(provSel.value === "custom" && !$("aiEndpoint").value.trim()) throw new Error("Укажите endpoint");

  files[activeFile] = $("editor").value;
  var ctx = "=== index.html ===\n" + files["index.html"] + "\n\n=== style.css ===\n" + files["style.css"] + "\n\n=== script.js ===\n" + files["script.js"];
  var fullPrompt = userText + "\n\nТекущие файлы проекта:\n" + ctx;

  if(p.type === "gemini"){
    var ep = p.endpoint + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(key);
    var r = await fetch(ep, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({contents:[{parts:[{text: SYSTEM_PROMPT + "\n\n" + fullPrompt}]}], generationConfig:{temperature: temp}})});
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok) throw new Error("Gemini " + r.status + ": " + (d.error && d.error.message ? d.error.message : r.statusText));
    return d.candidates[0].content.parts.map(function(x){ return x.text; }).join("");
  }
  if(p.type === "anthropic"){
    var r2 = await fetch(p.endpoint, {method:"POST", headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({model:model, max_tokens:4096, system:SYSTEM_PROMPT, messages:[{role:"user", content:fullPrompt}]})});
    var d2 = await r2.json().catch(function(){ return {}; });
    if(!r2.ok) throw new Error("Anthropic " + r2.status + ": " + (d2.error && d2.error.message ? d2.error.message : r2.statusText));
    return d2.content.map(function(x){ return x.text; }).join("");
  }
  var endpoint = provSel.value === "custom" ? $("aiEndpoint").value.trim() : p.endpoint;
  var r3 = await fetch(endpoint, {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer " + key},
    body: JSON.stringify({model:model, temperature:temp, messages:[{role:"system", content:SYSTEM_PROMPT},{role:"user", content:fullPrompt}]})});
  var d3 = await r3.json().catch(function(){ return {}; });
  if(!r3.ok){
    var msg = d3.error && d3.error.message ? d3.error.message : r3.statusText;
    if(r3.status === 401) msg = "Неверный API-ключ (401)";
    throw new Error(p.name + " " + r3.status + ": " + msg);
  }
  if(!d3.choices || !d3.choices[0]) throw new Error(p.name + ": пустой ответ API");
  return d3.choices[0].message.content;
}

async function sendPrompt(){
  var text = $("prompt").value.trim();
  if(!text) return;
  $("prompt").value = "";
  pushMsg({role:"user", text:text});
  var btn = $("btnSend"); btn.disabled = true; btn.textContent = "…";
  var wait = document.createElement("div");
  wait.className = "msg bot"; wait.textContent = "Думаю…";
  $("chat").appendChild(wait); $("chat").scrollTop = $("chat").scrollHeight;
  try{
    var raw = await callAI(text);
    wait.remove();
    var blocks = parseBlocks(raw);
    var summary = stripBlocks(raw) || "(только код)";
    if(blocks){
      applyBlocks(blocks);
      pushMsg({role:"bot", text:summary, applied:true});
      toast("ИИ обновил код проекта");
    }else{
      pushMsg({role:"bot", text:summary, error:"В ответе не найдено блоков кода — код не применён"});
    }
  }catch(err){
    wait.remove();
    var m = err.message || String(err);
    if(err instanceof TypeError) m = "Сетевая ошибка / блокировка CORS. Попробуйте Gemini, Groq или OpenRouter — они разрешают браузерные запросы. (" + m + ")";
    pushMsg({role:"bot", text:"Не удалось получить ответ.", error:m});
  }
  btn.disabled = false; btn.textContent = "Отправить";
}
$("btnSend").addEventListener("click", sendPrompt);
$("prompt").addEventListener("keydown", function(e){
  if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendPrompt(); }
});

(function init(){

  $("editor").value = files[activeFile];
  renderFiles(); updateCursor(); loadSettings(); renderChat(); runPreview();
})();
</script>
